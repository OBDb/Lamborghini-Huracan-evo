generations:
  - name: "First Generation"
    start_year: 2019
    end_year: 2024
    description: "The Lamborghini Huracán Evo represents a significant mid-cycle enhancement of the original Huracán platform launched in 2014. Introduced in 2019, the Evo incorporated the more powerful 5.2-liter naturally aspirated V10 engine from the Performante variant, producing 640 horsepower and 443 lb-ft of torque, enabling 0-62 mph acceleration in just 2.9 seconds. The most significant advancement was the introduction of the Lamborghini Dinamica Veicolo Integrata (LDVI) system, a central processing unit that coordinates all aspects of the car's dynamic behavior, including all-wheel drive, all-wheel steering, torque vectoring, and stability control systems to predictively enhance performance. Exterior revisions included a new front bumper with integrated aeroblades, revised side air intakes, a redesigned rear with an integrated ducktail spoiler and prominent twin exhaust outlets positioned higher in the fascia. The interior received a new 8.4-inch touchscreen infotainment system with gesture control, Apple CarPlay and Android Auto integration, and real-time telemetry display. The Evo was offered in both standard all-wheel drive configuration and a rear-wheel drive variant introduced in 2020 (Evo RWD), the latter providing a more purist driving experience with 610 horsepower. In 2021, the Huracán STO (Super Trofeo Omologata) joined the lineup as a road-legal track-focused variant with extensive weight reduction, aerodynamic enhancements generating 53% more downforce than the Performante, and revised suspension and braking systems. The Tecnica variant followed in 2022, positioned between the Evo RWD and STO, combining the STO's powertrain with a more road-focused setup. The Sterrato variant launched in 2023 as an all-terrain variant with increased ground clearance, widened track, and specialized off-road tires. The Huracán was succeeded by the Lamborghini Temerario in 2024."
